name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# 同一 PR 有新 push 时取消旧的 CI run，节省资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 测试 & 静态分析 ─────────────────────────────────────────────────────────
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["stable", "oldstable"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true          # 自动缓存 $GOPATH/pkg/mod

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (with race detector & coverage)
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: matrix.go-version == 'stable'
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ─── golangci-lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ─── 生产二进制构建验证 ──────────────────────────────────────────────────────
  build-release:
    name: Build Linux release binary
    runs-on: ubuntu-latest
    needs: [test]            # 仅测试通过后才构建

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build Linux amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o mcp-server \
            ./cmd/server/main.go

      - name: Verify binary
        run: |
          file mcp-server
          ls -lh mcp-server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-linux-amd64
          path: mcp-server
          retention-days: 7
